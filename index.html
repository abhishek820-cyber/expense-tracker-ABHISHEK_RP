<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Expense Tracker</h1>
    <p class="sub">Know where your money goes💸.</p>
  </header>

  <main>
    <section class="totals" aria-label="Totals">
      <div class="tot income"><span>Income</span><strong id="totalIncome">0</strong></div>
      <div class="tot expense"><span>Expenses</span><strong id="totalExpense">0</strong></div>
      <div class="tot balance"><span>Balance</span><strong id="balance">0</strong></div>
    </section>

    <div class="grid">
      <section class="card" aria-labelledby="formTitle">
        <h2 id="formTitle">Add transaction</h2>
        <form id="form" novalidate>
          <div class="seg" role="radiogroup" aria-label="Transaction type">
            <label><input type="radio" name="type" value="expense" checked><span>Expense</span></label>
            <label><input type="radio" name="type" value="income"><span>Income</span></label>
          </div>

          <label for="amount">Amount</label>
          <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
          <p class="err" id="amountErr" role="alert"></p>

          <label for="category">Category</label>
          <select id="category"></select>
          <p class="err" id="categoryErr" role="alert"></p>

          <label for="date">Date</label>
          <input id="date" type="date">
          <p class="err" id="dateErr" role="alert"></p>

          <label for="description">Description</label>
          <input id="description" type="text" maxlength="80" placeholder="e.g. Lunch with team">
          <p class="err" id="descriptionErr" role="alert"></p>

          <div class="actions">
            <button type="submit" class="primary" id="submitBtn">Add transaction</button>
            <button type="button" class="ghost" id="cancelBtn" hidden>Cancel edit</button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="listTitle">
        <h2 id="listTitle">Transactions</h2>
        <div class="filters">
          <select id="fType" aria-label="Filter by type">
            <option value="all">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="fCategory" aria-label="Filter by category"></select>
          <input id="fMonth" type="month" aria-label="Filter by month">
          <button type="button" class="ghost" id="clearFilters">Clear</button>
        </div>
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty" hidden></p>
      </section>
    </div>

    <section class="card" aria-labelledby="sumTitle">
      <div class="sumhead">
        <h2 id="sumTitle">Monthly summary</h2>
        <input id="sumMonth" type="month" aria-label="Summary month">
      </div>
      <div class="sumnums">
        <div><span>Income</span><strong id="mIncome">0</strong></div>
        <div><span>Expenses</span><strong id="mExpense">0</strong></div>
        <div><span>Saved</span><strong id="mNet">0</strong></div>
      </div>
      <h3>Spending by category</h3>
      <div id="chart" class="chart"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
